<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="200" fill="#0d1117" rx="12"/>
  
  <!-- JSON Box -->
  <rect x="40" y="50" width="280" height="100" fill="#161b22" stroke="#30363d" stroke-width="2" rx="8"/>
  <text x="180" y="85" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">AI Studio Export</text>
  <text x="180" y="110" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">chats.json</text>
  <text x="180" y="135" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">chunkedPrompt.chunks[]</text>
  
  <!-- Arrow 1 -->
  <line x1="330" y1="100" x2="410" y2="100" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="90" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">parse</text>
  
  <!-- Script Box -->
  <rect x="420" y="50" width="280" height="100" fill="#161b22" stroke="#30363d" stroke-width="2" rx="8"/>
  <text x="560" y="85" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">aistudio2md.py</text>
  <text x="560" y="110" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">--mode separate</text>
  <text x="560" y="135" text-anchor="middle" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">group_turns() → format_turn()</text>
  
  <!-- Arrow 2 -->
  <line x1="710" y2="100" x1="710" y1="100" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="90" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">export</text>
  
  <!-- Markdown Box -->
  <rect x="760" y="50" width="280" height="100" fill="#161b22" stroke="#30363d" stroke-width="2" rx="8"/>
  <text x="900" y="85" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Markdown Output</text>
  <text x="900" y="110" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">response-001.md</text>
  <text x="900" y="135" text-anchor="middle" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">clean, readable, version-controllable</text>
</svg>
